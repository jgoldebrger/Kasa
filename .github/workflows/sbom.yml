name: sbom

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cyclonedx:
    name: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@4.0.0 --output-file sbom.cdx.json --output-reproducible

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v5
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
